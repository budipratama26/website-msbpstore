# ══════════════════════════════════════════════════════════════════════════════
# 🛡️ MSBP Store — Nginx HTTP-Level Security Configuration
# ══════════════════════════════════════════════════════════════════════════════
# FILE: /data/nginx/custom/http_top.conf (di VPS via Nginx Proxy Manager)
#
# File ini HARUS di-copy ke VPS di path:
#   /data/nginx/custom/http_top.conf
#
# NPM akan otomatis include file ini ke dalam blok http {} Nginx.
# Setelah copy, restart NPM container: docker restart nginx-proxy-manager
# ══════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# 1. CLOUDFLARE REAL IP RESTORATION
# ──────────────────────────────────────────────────────────────────────────────
# Tanpa ini, Nginx melihat semua traffic dari IP Cloudflare (104.x.x.x)
# sehingga rate limiting akan mem-block SEMUA user sekaligus.
# Source: https://www.cloudflare.com/ips/

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Gunakan header CF-Connecting-IP sebagai real IP
# NOTE: real_ip_header dipindah ke server block (NPM Advanced tab)
# karena NPM sudah punya real_ip_header di nginx.conf utama

# ──────────────────────────────────────────────────────────────────────────────
# 2. RATE LIMITING ZONES
# ──────────────────────────────────────────────────────────────────────────────
# Zone memory: 10m ≈ 160,000 IP addresses (cukup untuk traffic normal)
#
# FORMAT: limit_req_zone $key zone=name:size rate=Xr/s;
#   - $binary_remote_addr = IP asli (sudah di-restore dari Cloudflare)
#   - rate = request per second yang diizinkan (steady state)

# General pages: 10 request/detik per IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# API endpoints: 20 request/detik per IP (API calls lebih banyak)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Auth/Login: 3 request/detik per IP (strict untuk brute force protection)
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

# ──────────────────────────────────────────────────────────────────────────────
# 3. CONNECTION LIMITING
# ──────────────────────────────────────────────────────────────────────────────
# Max koneksi simultan per IP — mencegah slowloris attack
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ──────────────────────────────────────────────────────────────────────────────
# 4. LOG FORMAT untuk fail2ban integration
# ──────────────────────────────────────────────────────────────────────────────
log_format ratelimit '$remote_addr - [$time_local] "$request" $status '
                     '"$http_user_agent" rate_limit_excess';
