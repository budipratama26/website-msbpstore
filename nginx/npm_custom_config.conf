# ══════════════════════════════════════════════════════════════════════════════
# 🛡️ MSBP Store — NPM Custom Nginx Configuration
# ══════════════════════════════════════════════════════════════════════════════
# CARA PAKAI:
# 1. Buka Nginx Proxy Manager → Hosts → Edit "msbpstore.my.id"
# 2. Klik tab "Advanced"
# 3. Copy-paste SELURUH isi mulai dari baris di bawah garis ====
# 4. Klik Save
#
# PENTING: Ini MENGGANTIKAN config custom yang ada sekarang.
# ══════════════════════════════════════════════════════════════════════════════

# ── Cloudflare Real IP (override NPM default) ────────────────────────────────
# NPM default pakai X-Real-IP, kita override ke CF-Connecting-IP
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── Anti-Bypass Cloudflare (Hanya izinkan IP Cloudflare) ─────────────────────
# Melindungi Origin Server dari Docker UFW Bypass
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;
# Izinkan jaringan lokal Docker
allow 127.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 10.0.0.0/8;
# Blokir semua IP selain Cloudflare
deny all;

# ── Proxy Headers (yang sudah ada + tambahan keamanan) ────────────────────────
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

# ── Connection & Request Size ────────────────────────────────────────────────
client_max_body_size 10m;
proxy_connect_timeout 10s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
send_timeout 15s;

# ── Connection Limiting ──────────────────────────────────────────────────────
# Max 20 koneksi simultan per IP
limit_conn conn_limit 20;
limit_conn_status 429;

# ── Rate Limiting (General) ──────────────────────────────────────────────────
# burst=20: izinkan burst 20 request, nodelay: proses langsung tanpa queue
limit_req zone=general burst=20 nodelay;
limit_req_status 429;

# ── Hide Server Info ─────────────────────────────────────────────────────────
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# ══════════════════════════════════════════════════════════════════════════════
# 🚫 PATH BLOCKING — Drop koneksi scanner LANGSUNG di Nginx
# ══════════════════════════════════════════════════════════════════════════════

# Block Unix user enumeration (/~user, /~web, /~root, dll)
location ~ ^/~  {
    access_log off;
    return 444;
}

# Block PHP/ASP/JSP files (kita bukan PHP server)
location ~* \.(php|asp|aspx|jsp|cgi)$ {
    access_log off;
    return 444;
}

# Block WordPress paths
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc) {
    access_log off;
    return 444;
}

# Block sensitive files & directories
location ~* ^/(\.|cgi-bin|config|backup|debug|console|shell|cmd|exec|eval) {
    access_log off;
    return 444;
}

# Block package/config file access
location ~* (package\.json|package-lock\.json|tsconfig\.json|composer\.json|Dockerfile|docker-compose|\.env|\.git|\.ssh|\.aws|\.vscode|\.htaccess|\.svn|\.hg) {
    access_log off;
    return 444;
}

# Block phpmyadmin / adminer
location ~* ^/(phpmyadmin|pma|adminer|myadmin|mysqladmin) {
    access_log off;
    return 444;
}

